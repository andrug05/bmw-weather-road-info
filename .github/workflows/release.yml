name: Build and publish MGU app and internet tool
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "0.2.0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "bmw-weather-road-info/**"
      - "native/aurelm-weather-net/**"
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version || '0.2.0' }}
      TOOL_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: aurelmarius/bmw-games
          path: upstream
      - uses: actions/checkout@v5
        with:
          repository: robertnisipeanu/mgu-store
          path: mgu-store
      - name: Build app
        run: |
          mkdir -p upstream/apps/aurelm_weather_traffic
          cp -a bmw-weather-road-info/apps/aurelm_weather_traffic/. upstream/apps/aurelm_weather_traffic/
          python3 - <<'PY'
          import json, os
          p='upstream/apps/aurelm_weather_traffic/app.json'
          d=json.load(open(p,encoding='utf-8'))
          d['version']=os.environ['APP_VERSION']
          json.dump(d,open(p,'w',encoding='utf-8'),indent=2)
          PY
          node bmw-weather-road-info/tests/model.test.js
          cd upstream
          python3 kit/tools/build.py aurelm_weather_traffic
          mkdir -p ../release
          cp "dist/aurelm_weather_traffic@${APP_VERSION}.tgz" ../release/
          cd ..
          python3 - <<'PY'
          import json, os, tarfile, tempfile
          p=f"release/aurelm_weather_traffic@${os.environ['APP_VERSION']}.tgz"
          with tempfile.TemporaryDirectory() as td:
              with tarfile.open(p,'r:gz') as tf: tf.extractall(td)
              pkg=os.path.join(td,'package','package.json')
              d=json.load(open(pkg,encoding='utf-8'))
              d.pop('mguInternet',None)
              json.dump(d,open(pkg,'w',encoding='utf-8'),indent=2)
              with tarfile.open(p,'w:gz') as tf: tf.add(os.path.join(td,'package'),arcname='package')
          PY
      - name: Build internet tool
        run: |
          node mgu-store/deploy/hu artifact native/aurelm-weather-net --out release
      - name: Build catalog
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          owner=os.environ['GITHUB_REPOSITORY']
          base='https://github.com/'+owner+'/releases/download/'
          entries=[]
          for ident,ver,kind,requires in [
            ('aurelm_weather_traffic',os.environ['APP_VERSION'],'app',{'aurelm-weather-net':os.environ['TOOL_VERSION'],'mgu-deploy':'0.7.0'}),
            ('aurelm-weather-net',os.environ['TOOL_VERSION'],'tool',{'mgu-deploy':'0.7.0'})
          ]:
            name=f'{ident}@{ver}.tgz'
            path='release/'+name
            h=hashlib.sha256(open(path,'rb').read()).hexdigest()
            entries.append({'id':ident,'kind':kind,'title':'Weather & Road Info' if kind=='app' else 'Weather & Road Internet Service','description':'BMW MGU ID7 weather and road information' if kind=='app' else 'Dedicated mgu-uplink internet fetch service','version':ver,'artifact':{'name':name,'size':os.path.getsize(path),'sha256':h,'url':base+ident+'@'+ver+'/'+name},'requires':requires,'uninstallable':True,'mguHmi':['ID7']})
          json.dump({'schema':2,'components':entries},open('release/catalog.json','w'),indent=2)
          PY
      - name: Publish app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "aurelm_weather_traffic@${APP_VERSION}" "release/aurelm_weather_traffic@${APP_VERSION}.tgz" --repo "${GITHUB_REPOSITORY}" --title "Weather & Road Info ${APP_VERSION}" --notes "BMW MGU ID7 app. Requires aurelm-weather-net internet tool."
      - name: Publish internet tool release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "aurelm-weather-net@${TOOL_VERSION}" "release/aurelm-weather-net@${TOOL_VERSION}.tgz" --repo "${GITHUB_REPOSITORY}" --title "Weather & Road Internet Service ${TOOL_VERSION}" --notes "Dedicated mgu-uplink UID fetch service."
      - name: Publish catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view catalog --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && gh release upload catalog release/catalog.json --repo "${GITHUB_REPOSITORY}" --clobber || gh release create catalog release/catalog.json --repo "${GITHUB_REPOSITORY}" --title "MGU Store catalog" --notes "Weather & Road Info app and its mgu-uplink internet service."
