name: Build and publish Weather & Road Info
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "0.2.5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "bmw-weather-road-info/**"
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version || '0.2.5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: aurelmarius/bmw-games
          path: upstream
      - name: Build app
        run: |
          mkdir -p upstream/apps/aurelm_weather_traffic
          cp -a bmw-weather-road-info/apps/aurelm_weather_traffic/. upstream/apps/aurelm_weather_traffic/
          python3 - <<'PY'
          import json, os
          p='upstream/apps/aurelm_weather_traffic/app.json'
          d=json.load(open(p,encoding='utf-8'))
          d['version']=os.environ['APP_VERSION']
          d['internet']=True
          json.dump(d,open(p,'w',encoding='utf-8'),indent=2)
          PY
          node --check upstream/apps/aurelm_weather_traffic/main.js
          node --check upstream/apps/aurelm_weather_traffic/http.js
          node --check upstream/apps/aurelm_weather_traffic/uplink.js
          node bmw-weather-road-info/tests/model.test.js
          cd upstream
          python3 kit/tools/build.py aurelm_weather_traffic
          mkdir -p ../release
          cp "dist/aurelm_weather_traffic@${APP_VERSION}.tgz" ../release/
          cd ..
          python3 - <<'PY'
          import json, os, tarfile, tempfile
          artifact=f"release/aurelm_weather_traffic@{os.environ['APP_VERSION']}.tgz"
          with tempfile.TemporaryDirectory() as td:
              with tarfile.open(artifact,'r:gz') as tf: tf.extractall(td)
              package=os.path.join(td,'package','package.json')
              data=json.load(open(package,encoding='utf-8'))
              data['mguInternet']=True
              json.dump(data,open(package,'w',encoding='utf-8'),indent=2)
              with tarfile.open(artifact,'w:gz') as tf: tf.add(os.path.join(td,'package'),arcname='package')
          PY
      - name: Build catalog
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          version=os.environ['APP_VERSION']
          name=f'aurelm_weather_traffic@{version}.tgz'
          path='release/'+name
          entry={'id':'aurelm_weather_traffic','kind':'app','title':'Weather & Road Info',
            'description':'BMW MGU ID7 weather and road information; diagnostic status and bounded mgu-uplink requests.',
            'version':version,'artifact':{'name':name,'size':os.path.getsize(path),
            'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest(),
            'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/aurelm_weather_traffic%40'+version+'/'+name},
            'uninstallable':True,'mguHmi':['ID7']}
          json.dump({'schema':2,'components':[entry]},open('release/catalog.json','w'),indent=2)
          PY
      - name: Publish app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="aurelm_weather_traffic@${APP_VERSION}"
          ASSET="release/aurelm_weather_traffic@${APP_VERSION}.tgz"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --title "Weather & Road Info ${APP_VERSION}" --notes "Fixes mgu-uplink DNS lease handling and adds DNS/TCP/TLS/HTTP stage diagnostics."
          fi
      - name: Publish catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload catalog release/catalog.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create catalog release/catalog.json --repo "$GITHUB_REPOSITORY" --title "MGU Store catalog" --notes "Weather & Road Info."
          fi
